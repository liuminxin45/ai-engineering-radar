name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RADAR_DATA_DIR: .radar/data
      BASE_PATH: /ai-engineering-radar
      SITE_URL: https://example.org
      RADAR_ALLOW_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:check
      - run: pnpm test
      - run: pnpm test:fixture
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm check:public
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
