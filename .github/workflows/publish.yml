name: Collect and publish
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      collect:
        description: Collect sources before publishing
        type: boolean
        default: true
  push:
    branches: [main]
concurrency:
  group: radar-data-and-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'liuminxin45/ai-engineering-radar'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RADAR_DATA_DIR: .radar/data
      BASE_PATH: /ai-engineering-radar
      SITE_URL: https://liuminxin45.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: .radar/state
      - uses: pnpm/action-setup@v4
      - name: Place package preparation outside node_modules
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore durable snapshot
        run: cp -a .radar/state/snapshot .radar/data
      - run: pnpm registry:check && pnpm data:migrate-domestic && pnpm data:check && pnpm test
      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/browser-fetch/requirements.txt
      - uses: actions/cache@v4
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-${{ runner.arch }}-camoufox-0.5.9-browser-158.0.1-beta.41
      - name: Prepare isolated browser acquisition
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r services/browser-fetch/requirements.txt
          python -m camoufox fetch official/158.0.1-beta.41
          python -m playwright install-deps firefox
          python -m unittest discover -s services/browser-fetch -p 'test_*.py'
          mkdir -p work
          python services/browser-fetch/server.py > work/browser-fetch-service.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:1201/healthz; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Start isolated RSSHub for CSDN
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: |
          pnpm --dir services/rsshub install --ignore-workspace --ignore-scripts --frozen-lockfile
          pnpm --dir services/rsshub test
          mkdir -p work
          node services/rsshub/server.mjs > work/rsshub-service.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:1200/healthz; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Collect new or changed articles and retry failures
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        env:
          RSSHUB_URL: http://127.0.0.1:1200
          BROWSER_FETCH_URL: http://127.0.0.1:1201
        run: pnpm ingest --daily
      - name: Screen articles with AI
        if: vars.RADAR_AI_SCREEN_MODE != '' && vars.RADAR_AI_SCREEN_MODE != 'off' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect))
        env:
          RADAR_AI_SCREEN_MODE: ${{ vars.RADAR_AI_SCREEN_MODE }}
          RADAR_AI_API_URL: ${{ vars.RADAR_AI_API_URL }}
          RADAR_AI_LLM: ${{ vars.RADAR_AI_LLM }}
          RADAR_AI_API_KEY: ${{ secrets.RADAR_AI_API_KEY }}
        run: pnpm ai:screen
      - run: pnpm data:check && pnpm build && pnpm typecheck && pnpm check:public
        env:
          RADAR_AI_SCREEN_MODE: off
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Browser regression tests use the full catalog, including the soft-ad samples.
      - name: Build and validate screened publication
        if: vars.RADAR_AI_SCREEN_MODE == 'enforce'
        env:
          RADAR_AI_SCREEN_MODE: enforce
        run: pnpm build && pnpm check:public
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            work/*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit validated snapshot
        run: |
          rsync -a --delete .radar/data/ .radar/state/snapshot/
          cd .radar/state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshot
          if ! git diff --cached --quiet; then
            git commit -m 'data: update reviewed engineering metadata'
            for attempt in 1 2 3; do
              if git push origin HEAD:data; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 5))
            done
          fi
      - name: Publish source acceptance summary
        run: cat work/source-acceptance.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Place package preparation outside node_modules
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:live
