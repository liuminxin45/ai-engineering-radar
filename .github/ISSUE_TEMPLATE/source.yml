name: 来源提议 / Suggest a source
description: 提议国内公司官方技术站或第三方博客社区中的国内官方账号，也可补充现有来源证据。
title: "[Source] "
body:
  - type: markdown
    attributes:
      value: |
        首批仅收录国内公司，欢迎提供来源线索或提交 PR。公司自有站和第三方博客社区中的国内官方账号都可以提议，本批暂不接入海外来源。
        材料尚不完整时写“待补充”即可，请只提交公开信息。
        This batch covers Chinese companies only, including official accounts on third-party communities. Overseas sources are outside this batch. Mark unknown details as pending.
  - type: input
    id: company
    attributes:
      label: 公司与发布主体 / Company and publisher
      description: 国内公司或品牌，以及具体技术团队或组织。
    validations:
      required: true
  - type: textarea
    id: account
    attributes:
      label: 平台与账号 / Platform and account
      description: 平台名称、账号主页和稳定账号 ID；公司自有网站可说明域名。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 官方证据 / Ownership evidence
      description: 官网反向链接、官方域名或平台企业认证等公开 URL，附核验日期与判断依据；未确认可写待补充。
    validations:
      required: true
  - type: textarea
    id: endpoints
    attributes:
      label: 允许采集的入口 / Permitted endpoints
      description: 读者入口、RSS / Atom、公开 API 或 HTML 文章目录；补充 robots.txt、访问条件及已知限制。
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: 文章示例与适配线索 / Examples and parser notes
      description: 文章 URL、作者 ID 字段、可用 fixture 与测试线索；请勿粘贴全文、凭据或个人资料。
  - type: textarea
    id: gaps
    attributes:
      label: 待确认事项 / Open questions
      description: 需要补充的证据、失效入口、访问限制或希望协助的适配工作。
